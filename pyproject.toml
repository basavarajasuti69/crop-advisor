[project]
name = "crop-advisor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.0",
    "langgraph>=0.6.0",
    "langchain-core>=0.3.0",
    "boto3==1.35.0",
    "httpx==0.28.0",
    "botocore==1.35.0",
    "httpx==0.28.0",
    "Pillow==11.0.0",
    "torch",
    "torchvision",
    "albumentations==1.4.0",
    "redis==5.1.0",
    "pytest==8.3.0",
    "pytest-asyncio==0.26.0",
    "httpx==0.28.0",
    "mcp==1.8.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.9.0",
    "mypy==1.13.0",
    "black==24.10.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
