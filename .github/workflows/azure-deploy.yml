name: Azure Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy"
        required: false
        default: "latest"
  push:
    branches: [main]
    paths:
      - 'agents/**'
      - 'apps/api/**'
      - 'mcp_servers/**'
      - 'rag/**'
      - 'speech/**'
      - 'strings/**'
      - 'scripts/**'
      - '.github/workflows/azure-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: azure
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to the container registry
        uses: azure/login@v2
        with:
          registry: ${{ vars.AZURE_ACR_NAME }}

      # The ONNX model is a build artifact and is not in git. It is fetched
      # from blob storage before the image is built.
      - name: Fetch the ONNX model
        env:
          AZURE_MODEL_URL: ${{ secrets.AZURE_MODEL_URL }}
        run: |
          set -euo pipefail
          mkdir -p ml/export_edge/artifacts
          if [ -n "${AZURE_MODEL_URL}" ]; then
            curl -fsSL "${AZURE_MODEL_URL}" -o ml/export_edge/artifacts/classifier.onnx
            curl -fsSL "${AZURE_MODEL_URL%.onnx}-classes.json" \
              -o ml/export_edge/artifacts/classes.json \
              || curl -fsSL "${AZURE_MODEL_URL}.classes.json" \
                   -o ml/export_edge/artifacts/classes.json
          else
            echo "::warning::AZURE_MODEL_URL is not set - the image will have no model."
          fi

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile.azure
          platforms: linux/amd64
          push: true
          tags: ${{ vars.AZURE_ACR_NAME }}.azurecr.io/crop-advisor-api:${{ inputs.image_tag || 'latest' }}

      - name: Deploy to Container Apps
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ${{ vars.AZURE_CONTAINER_APP }} \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --image ${{ vars.AZURE_ACR_NAME }}.azurecr.io/crop-advisor-api:${{ inputs.image_tag || 'latest' }}
