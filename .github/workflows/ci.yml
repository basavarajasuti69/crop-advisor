name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r apps/api/requirements.txt
          pip install pytest pytest-asyncio httpx ruff==0.9.0 mypy==1.13.0
      - name: Ruff lint
        run: ruff check apps agents ml rag speech safety evals
      - name: Type check
        run: mypy --explicit-package-bases --ignore-missing-imports apps agents ml rag speech safety
      - name: Run tests
        run: pytest tests -q
    env:
      CA_REGION: ap-south-1
