name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r apps/api/requirements.txt
          pip install pytest pytest-asyncio httpx ruff==0.9.0 mypy==1.13.0
      - name: Ruff lint
        run: ruff check apps agents ml rag speech safety evals
      - name: Type check
        run: mypy --explicit-package-bases --ignore-missing-imports apps agents ml rag speech safety
      - name: Run tests
        run: pytest tests -q
    env:
      AWS_REGION: ap-south-1
      CA_REGION: ap-south-1

  # LEGACY: pushes the image to AWS ECR. The deployment target is now
  # Hugging Face Spaces (see the "Deploy (free)" section of README.md).
  # This job is skipped unless AWS credentials are configured.
  build-and-push:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      # The AWS image push needs credentials. The deployment target is Azure
      # Container Apps; this job only runs when AWS credentials are configured.
      - name: Check for AWS credentials
        id: aws
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -n "${AWS_ACCESS_KEY_ID}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS credentials are not configured - skipping the ECR image push."
          fi
      - name: Set up Docker Buildx
        if: steps.aws.outputs.available == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Login to Amazon ECR
        if: steps.aws.outputs.available == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push API image
        if: steps.aws.outputs.available == 'true'
        uses: docker/build-push-action@v6
        with:
          # The image needs agents/, rag/, speech/ and strings/, so the build
          # context is the repository root.
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/crop-advisor-api:latest
    env:
      AWS_REGION: ap-south-1
      AWS_DEFAULT_REGION: ap-south-1
