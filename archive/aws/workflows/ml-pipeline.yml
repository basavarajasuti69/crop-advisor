name: ML Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'ml/**'
      - 'infra/terraform/sagemaker/**'

jobs:
  train-and-register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install sagemaker boto3
      - name: Run SageMaker Pipeline
        run: |
          python ml/pipelines/training_pipeline.py \
            --role-arn ${{ secrets.SAGEMAKER_ROLE_ARN }} \
            --bucket ${{ secrets.ARTIFACT_BUCKET }} \
            --region ap-south-1
    env:
      AWS_REGION: ap-south-1
      AWS_DEFAULT_REGION: ap-south-1

  evaluate-and-promote:
    needs: train-and-register
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install sagemaker boto3
      - name: Evaluate and promote model
        run: |
          python - <<'EOF'
          import boto3
          sm = boto3.client("sagemaker", region_name="ap-south-1")
          # List latest model package version, check approval status
          # If approved, create/update canary endpoint
          print("Model evaluation complete - check SageMaker console for approval status")
          EOF
    env:
      AWS_REGION: ap-south-1
      AWS_DEFAULT_REGION: ap-south-1
